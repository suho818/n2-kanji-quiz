<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N2 한자읽기 기출 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 모눈 메모지 위에 문제지 한 장. 채점은 빨간 펜: 정답 ○, 오답 / */
  --paper: #f2f4f1;
  --sheet: #ffffff;
  --ink: #1a2130;
  --muted: #5b6676;
  --rule: #dce2ea;
  --accent: #2455a4;
  --pen: #d0362a;
  --font-jp: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141b; --sheet: #191f2a; --ink: #e5e9ef; --muted: #9ba5b5;
    --rule: #252d3a; --accent: #89b0f0; --pen: #ff6b5d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141b; --sheet: #191f2a; --ink: #e5e9ef; --muted: #9ba5b5;
  --rule: #252d3a; --accent: #89b0f0; --pen: #ff6b5d; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 24px 24px;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.jp { font-family: var(--font-jp); }
main { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible + label, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.sheet {
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 20px 18px;
}
.stack { display: grid; gap: 14px; }

/* ---------- 홈 ---------- */
.mast { display: grid; gap: 6px; padding: 4px 2px 6px; }
.eyebrow { margin: 0; font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
h1 { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.dday { margin: 2px 0 0; font-size: 15px; color: var(--muted); }
.dday b { color: var(--pen); font-size: 17px; font-variant-numeric: tabular-nums; margin-right: 4px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 0; overflow: hidden; }
.stat { padding: 14px 12px; display: grid; gap: 2px; }
.stat + .stat { border-left: 1px solid var(--rule); }
.stat .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .n small { font-size: 13px; font-weight: 500; color: var(--muted); }
.stat .l { font-size: 12px; color: var(--muted); }

fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; min-width: 0; }
legend { padding: 0; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.sr { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-card {
  display: grid; gap: 4px; padding: 14px; border: 1.5px solid var(--rule);
  border-radius: 12px; background: var(--sheet); cursor: pointer; height: 100%;
}
.mode-card strong { font-size: 16px; }
.mode-card span { font-size: 13px; color: var(--muted); line-height: 1.4; }
input:checked + .mode-card { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
input:checked + .mode-card strong { color: var(--accent); }
input:disabled + .mode-card { opacity: .5; cursor: not-allowed; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border: 1px solid var(--rule); border-radius: 999px;
  background: var(--sheet); font-size: 14px; cursor: pointer; user-select: none;
}
.chip em { font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
input:checked + .chip { background: var(--accent); border-color: var(--accent); color: var(--paper); }
input:checked + .chip em { color: var(--paper); opacity: .85; }
input:disabled + .chip { opacity: .45; cursor: not-allowed; }

.primary {
  width: 100%; min-height: 54px; border: 0; border-radius: 12px;
  background: var(--accent); color: var(--paper); font-size: 17px; font-weight: 600;
}
.primary:active { transform: translateY(1px); }
.ghost {
  width: 100%; min-height: 50px; border-radius: 12px; border: 1px solid var(--rule);
  background: var(--sheet); font-size: 16px; font-weight: 500;
}
details.sheet { padding: 0; }
details summary { padding: 14px 18px; font-size: 14px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
details summary::after { content: "열기"; font-weight: 400; color: var(--muted); font-size: 13px; }
details[open] summary::after { content: "닫기"; }
details .inner { padding: 0 18px 16px; display: grid; gap: 12px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.note.warn { color: var(--pen); }
.voice-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 15px; }
.voice-row select { min-width: 0; width: 100%; font: inherit; font-size: 14px; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); }
.reset { background: none; border: 0; padding: 0; font-size: 13px; color: var(--muted); text-decoration: underline; justify-self: start; }

/* ---------- 문제 ---------- */
.qbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.quit { background: none; border: 0; padding: 6px 0; font-size: 14px; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.count { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 52px; text-align: right; }

.mondai { margin: 0 0 6px; font-size: 13.5px; color: var(--muted); line-height: 1.6; }
.mondai b { color: var(--ink); font-weight: 700; margin-right: 6px; }
.stem { display: grid; justify-items: center; gap: 18px; padding: 22px 0 18px; }
.word {
  font-family: var(--font-jp); font-weight: 700; font-size: 46px; line-height: 1.2;
  text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 10px;
  text-align: center; word-break: keep-all;
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.tag.hot { color: var(--accent); border-color: var(--accent); }

.listen { display: grid; justify-items: center; gap: 12px; }
.play {
  width: 92px; height: 92px; border-radius: 50%; border: 0;
  background: var(--accent); color: var(--paper); display: grid; place-items: center;
}
.play svg { width: 38px; height: 38px; }
.slow { border: 1px solid var(--rule); background: var(--sheet); border-radius: 99px; padding: 6px 14px; font-size: 14px; }
.listen-hint { font-size: 13px; color: var(--muted); margin: 0; }

.opts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts.one { grid-template-columns: 1fr; }
.opt {
  position: relative; width: 100%; min-height: 58px; display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet);
  text-align: left; font-family: var(--font-jp); font-size: 21px; font-weight: 500; line-height: 1.3;
}
.opt .num {
  flex: none; width: 24px; height: 24px; display: grid; place-items: center;
  border: 1px solid var(--muted); border-radius: 5px; font-family: var(--font-ui);
  font-size: 13px; font-weight: 600; color: var(--muted);
}
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.dim { opacity: .5; }
.opt.right::after, .opt.wrong::after {
  content: ""; position: absolute; pointer-events: none;
  animation: ink .22s ease-out both;
}
.opt.right::after {
  inset: -5px -3px; border: 2.5px solid var(--pen);
  border-radius: 48% 52% 46% 54% / 56% 44% 56% 44%;
  transform: rotate(-2deg);
}
.opt.wrong::after {
  inset: 6px 10px;
  background: linear-gradient(to top right, transparent calc(50% - 1.5px), var(--pen) calc(50% - 1.5px), var(--pen) calc(50% + 1.5px), transparent calc(50% + 1.5px));
}
@keyframes ink { from { opacity: 0; transform: scale(1.12) rotate(-6deg); } }

.feedback { margin-top: 14px; display: grid; gap: 10px; }
.verdict { font-size: 18px; font-weight: 700; color: var(--pen); display: flex; align-items: center; gap: 8px; }
.verdict .sym { font-size: 22px; line-height: 1; }
.answer { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; }
.answer .w { font-family: var(--font-jp); font-size: 26px; font-weight: 700; }
.answer .r { font-family: var(--font-jp); font-size: 20px; color: var(--accent); font-weight: 500; }
.say {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule);
  background: var(--sheet); display: grid; place-items: center; color: var(--accent); flex: none;
}
.say svg { width: 20px; height: 20px; }
.mean { margin: 0; font-size: 16px; }
.next { position: sticky; bottom: 12px; margin-top: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }

.kinfo { margin-top: 4px; border-top: 1px dashed var(--rule); padding-top: 12px; display: grid; gap: 12px; }
.kinfo h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.krow { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; }
.kchar {
  font-family: var(--font-jp); font-size: 34px; font-weight: 700; line-height: 1;
  width: 52px; height: 52px; display: grid; place-items: center;
  border: 1px solid var(--rule); border-radius: 10px;
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 50% 50%; background-position: center;
}
.kbody { display: grid; gap: 3px; min-width: 0; font-size: 14px; line-height: 1.5; }
.khun { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.khun b { font-size: 16px; }
.kold { font-family: var(--font-jp); color: var(--muted); font-size: 15px; }
.kstroke { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kused { color: var(--accent); }
.kused .jp { font-weight: 700; font-size: 15px; }
.knote { color: var(--muted); font-size: 12.5px; }
.kread { color: var(--ink); }
.kread .lbl { display: inline-block; font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; margin-right: 4px; vertical-align: 1px; }
.kread .jp { font-size: 14px; }
.kread b { color: var(--accent); }
.kread + .kread { margin-top: -1px; }
.kother { font-size: 13px; color: var(--muted); }
.kother .jp { color: var(--ink); font-size: 14px; }
.credit { margin: 4px 2px 0; font-size: 12px; color: var(--muted); }
.credit a { color: inherit; }

/* ---------- 결과 ---------- */
.score { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.score .big { font-size: 64px; font-weight: 700; line-height: 1; }
.score .of { font-size: 22px; color: var(--muted); }
.score .pct { margin-left: auto; font-size: 18px; font-weight: 600; color: var(--accent); }
.msg { margin: 6px 0 0; color: var(--muted); }
h2 { font-size: 16px; margin: 0; }
.wlist { list-style: none; margin: 0; padding: 0; }
.wlist li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
.wlist li:first-child { border-top: 0; padding-top: 0; }
.wlist .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.wlist .w { font-family: var(--font-jp); font-size: 21px; font-weight: 700; }
.wlist .r { font-family: var(--font-jp); font-size: 16px; color: var(--accent); }
.wlist .m { font-size: 13.5px; color: var(--muted); }
.wlist .say { grid-row: span 2; grid-column: 2; }

@media (max-width: 360px) {
  .word { font-size: 38px; }
  .opt { font-size: 19px; padding: 10px 12px; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .opt.right::after, .opt.wrong::after { animation: none; }
  .bar span { transition: none; }
}
</style>
</head>
<body>
<main>

<!-- 홈 -->
<section id="home" class="stack">
  <div class="mast">
    <p class="eyebrow">JLPT N2 · 問題1 漢字読み</p>
    <h1>한자읽기 기출 퀴즈</h1>
    <p class="dday" id="dday"></p>
  </div>

  <div class="sheet stats" aria-label="학습 현황">
    <div class="stat"><span class="n" id="st-seen">0</span><span class="l">풀어본 단어</span></div>
    <div class="stat"><span class="n" id="st-acc">–</span><span class="l">누적 정답률</span></div>
    <div class="stat"><span class="n" id="st-wrong">0</span><span class="l">오답노트</span></div>
  </div>

  <fieldset>
    <legend>모드</legend>
    <div class="modes">
      <div>
        <input class="sr" type="radio" name="mode" id="mode-read" value="read">
        <label class="mode-card" for="mode-read"><strong>읽기 · 시험형</strong><span>한자를 보고 맞는 읽기를 고르기</span></label>
      </div>
      <div>
        <input class="sr" type="radio" name="mode" id="mode-listen" value="listen">
        <label class="mode-card" for="mode-listen"><strong>듣기 · 소리→한자</strong><span>발음을 듣고 맞는 한자를 고르기</span></label>
      </div>
    </div>
    <p class="note warn" id="voice-note" hidden></p>
  </fieldset>

  <fieldset>
    <legend>범위</legend>
    <div class="chips" id="ranges"></div>
  </fieldset>

  <fieldset>
    <legend>문제 수</legend>
    <div class="chips" id="counts"></div>
  </fieldset>

  <button class="primary" id="start">시작하기</button>

  <details class="sheet">
    <summary>소리 · 기록 설정</summary>
    <div class="inner">
      <label class="toggle" for="opt-auto">읽기 모드에서 답한 뒤 발음 자동 재생 <input type="checkbox" id="opt-auto"></label>
      <label class="toggle" for="opt-slow">조금 천천히 읽기 <input type="checkbox" id="opt-slow"></label>
      <label class="toggle" for="opt-kanji">한자로 읽혀서 억양 자연스럽게 <input type="checkbox" id="opt-kanji"></label>
      <div class="voice-row">
        <label for="opt-voice">음성</label>
        <select id="opt-voice"></select>
        <button class="slow" id="voice-test">미리 듣기</button>
      </div>
      <p class="note" id="voice-help">발음은 이 기기에 깔린 일본어 음성으로 나와요. 이름에 Natural · Online · Enhanced · Premium · Google 이 붙은 음성이 더 자연스러워요. 무음 모드면 소리가 안 날 수 있어요.</p>
      <button class="reset" id="reset">학습 기록 지우기</button>
      <p class="note" id="reset-msg" hidden></p>
    </div>
  </details>
  <p class="credit">한자 음독·훈독: <a href="https://www.edrdg.org/wiki/index.php/KANJIDIC_Project">KANJIDIC2</a> (EDRDG, CC BY-SA 4.0)</p>
</section>

<!-- 문제 -->
<section id="quiz" hidden>
  <div class="qbar">
    <button class="quit" id="quit">그만하기</button>
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    <span class="count" id="count"></span>
  </div>
  <article class="sheet">
    <p class="mondai" id="mondai"></p>
    <div id="stem"></div>
    <ol class="opts" id="opts"></ol>
    <div class="feedback" id="feedback" hidden></div>
  </article>
  <button class="primary next" id="next" hidden>다음 문제</button>
</section>

<!-- 결과 -->
<section id="result" class="stack" hidden>
  <div class="sheet">
    <div class="score"><span class="big" id="r-score"></span><span class="of" id="r-total"></span><span class="pct" id="r-pct"></span></div>
    <p class="msg" id="r-msg"></p>
  </div>
  <div class="sheet stack" id="r-wrong-box">
    <h2 id="r-wrong-title">틀린 단어</h2>
    <ul class="wlist" id="r-wrong"></ul>
  </div>
  <button class="primary" id="retry-wrong">틀린 단어만 다시 풀기</button>
  <button class="ghost" id="retry-same">같은 범위 새로 풀기</button>
  <button class="ghost" id="go-home">처음으로</button>
</section>

</main>

<script>

"うくぐすずつづぬふぶぷむゆるゅぅ".split("").forEach(c => VOWEL[c] = "u");

const VOICE = { か:"が",き:"ぎ",く:"ぐ",け:"げ",こ:"ご",さ:"ざ",し:"じ",す:"ず",せ:"ぜ",そ:"ぞ",た:"だ",て:"で",と:"ど" };

// 단어를 [한자부 읽기, 오쿠리가나]로 나눔. ～的 은 てき 를 고정 부분으로 봄

  if (word.endsWith("的") && r.endsWith("てき") && word.length > 1) return { stem: r.slice(0, -2), okuri: "てき", compound: true };

// 시험에 실제로 나오는 함정 유형: 장음, 탁음/반탁음, 촉음, 요음
function mutations(stem, hasOkuri, compound) {
  const M = morae(stem), n = M.length, ops = [];
  for (let i = 0; i < n; i++) {
    const m = M[i], c = m[0], rest = m.slice(1), prev = M[i - 1], next = M[i + 1];
    const afterNT = prev === "ん" || prev === "っ";
    // 탁음 토글
    if (VOICE[c]) ops.push({ i, s: VOICE[c] + rest, t: "dak" });
    if (UNVOICE[c]) ops.push({ i, s: UNVOICE[c] + rest, t: "dak" });
    let hi = H.indexOf(c), bi = B.indexOf(c), pi = P.indexOf(c);
    if (hi >= 0) { ops.push({ i, s: B[hi] + rest, t: "dak" }); if (afterNT) ops.push({ i, s: P[hi] + rest, t: "dak" }); }
    if (bi >= 0) { ops.push({ i, s: H[bi] + rest, t: "dak" }); if (afterNT) ops.push({ i, s: P[bi] + rest, t: "dak" }); }
    if (pi >= 0) { if (prev !== "っ") ops.push({ i, s: H[pi] + rest, t: "dak" }); ops.push({ i, s: B[pi] + rest, t: "dak" }); }
    // 장음 빼기
    if (i > 0) {
      const pv = vowelOf(prev);
      if (m === "う" && (pv === "o" || pv === "u") && prev !== "う") ops.push({ i, s: "", t: "long" });
      if (m === "い" && pv === "e") ops.push({ i, s: "", t: "long" });
      if (m === "お" && pv === "o") ops.push({ i, s: "", t: "long" });
    }
    // 장음 넣기
    const lastStem = hasOkuri && i === n - 1;
    if (!lastStem && !"んっうい".includes(m) && !(next && "うんっおい".includes(next))) {
      const v = vowelOf(m);
      if (v === "o" && m !== "お") ops.push({ i, s: m + "う", t: "long" });
      else if (m.endsWith("ゅ") || m === "ゆ") ops.push({ i, s: m + "う", t: "long" });
      else if (v === "e" && m !== "え") ops.push({ i, s: m + "い", t: "long" });
    }
    // 촉음
    if (m === "っ") {
      ops.push({ i, s: "", t: "tsu" });
      ops.push({ i, s: next && consOf(next) === "k" ? "く" : "つ", t: "tsu" });
    } else if (compound && next && i <= 1 && "kst".includes(consOf(next) || "_") && consOf(next)) {
      // 촉음 함정은 음독 한자어에서만 (きかく→きっかく, てきせつ→てっせつ)
      if ("つくちき".includes(m) && i > 0) ops.push({ i, s: "っ", t: "tsu" });
      else if (!"んういー".includes(m) && m.length === 1) ops.push({ i, s: m + "っ", t: "tsu" });
    }
    // 요음 ゅ↔ょ
    if (m.endsWith("ゅ")) ops.push({ i, s: m.slice(0, -1) + "ょ", t: "yoon" });
    if (m.endsWith("ょ")) ops.push({ i, s: m.slice(0, -1) + "ゅ", t: "yoon" });
  }

}

function applyOps(M, list) {
  const A = M.slice();

  return A.join("");
}

function looksOk(s) {

}

// 읽기 4지선다 선택지
function readingOptions(word, all, alsoValid) {
  const { stem, okuri, compound } = splitOkuri(word.w, word.r);
  const bad = new Set([word.r, ...(alsoValid[word.w] || [])]);
  const { M, ops } = mutations(stem, !!okuri && okuri !== "てき", compound);
  const mk = list => applyOps(M, list) + okuri;
  const ok = s => looksOk(s) && !bad.has(s);

  // 1) 2x2 함정 (예: しょうさい / しょさい / しょうざい / しょざい)
  const pairs = [];
  for (let a = 0; a < ops.length; a++) for (let b = a + 1; b < ops.length; b++) {
    const A = ops[a], B = ops[b];
    if (A.i === B.i) continue;
    const x = mk([A]), y = mk([B]), xy = mk([A, B]);
    if (![x, y, xy].every(ok) || new Set([x, y, xy]).size < 3) continue;
    const w = (A.t !== B.t ? 3 : 1) + (A.t === "long" || B.t === "long" ? 1 : 0);
    for (let k = 0; k < w; k++) pairs.push([x, y, xy]);
  }
  let dis = [];
  if (pairs.length && Math.random() < 0.85) dis = pick(pairs);

  // 2) 부족하면 단일 함정
  if (dis.length < 3) {
    shuffle(ops.map(o => mk([o]))).forEach(s => { if (dis.length < 3 && ok(s) && !dis.includes(s)) dis.push(s); });
  }
  // 3) 같은 품사 모양의 다른 기출어 읽기로 채움
  //    동사·형용사는 오쿠리가나가 같은 것 (争う → きそう), 명사는 글자 수·길이가 비슷한 것

    const scored = all.filter(o => o.id !== word.id).map(o => {
      const p = splitOkuri(o.w, o.r);

    for (const { r } of scored) { if (dis.length >= 3) break; if (ok(r) && !dis.includes(r)) dis.push(r); }

}

// 듣기 모드 선택지: 소리가 비슷한 다른 단어 (같은 읽기는 제외)
function listeningOptions(word, all) {
  const len = morae(word.r).length, first = morae(word.r)[0];
  const okuri = splitOkuri(word.w, word.r).okuri;
  const cands = all.filter(o => o.r !== word.r && o.w !== word.w).map(o => {
    const om = morae(o.r);
    let s = Math.random() * 1.5;
    if (om[0] === first) s += 2;
    else if (om[0][0] === first[0]) s += 1;
    if (Math.abs(om.length - len) <= 1) s += 1;
    if (!!splitOkuri(o.w, o.r).okuri === !!okuri) s += 1;
    return { o, s };

  shuffle(cands).forEach(({ o }) => { if (chosen.length < 3 && !chosen.some(c => c.w === o.w)) chosen.push(o); });

      return used && used[2] === "훈" && (st === base || full === base) ? `<b>${esc(x)}</b>` : esc(x);
    }).join(" · ");
    const others = (KANJI_WORDS[ch] || []).filter(o => o.id !== w.id).slice(0, 4);
    return `<div class="krow">
      <div class="kchar" lang="ja">${esc(ch)}</div>
      <div class="kbody">
        <div class="khun"><b>${esc(hun)}</b>${old ? `<span class="kold" lang="ja">${esc(old)}</span>` : ""}<span class="kstroke">${sc}획</span></div>
        ${used ? `<div class="kused">이 단어에서 <span class="jp" lang="ja">${esc(used[1])}</span> · ${used[2] === "특수" ? "특별한 읽기" : used[2] + "독"}${used[3] ? ` <span class="knote">(${esc(used[3])})</span>` : ""}</div>` : ""}
        ${on.length ? `<div class="kread"><span class="lbl">음</span><span class="jp" lang="ja">${onH}</span></div>` : ""}
        ${kun.length ? `<div class="kread"><span class="lbl">훈</span><span class="jp" lang="ja">${kunH}</span></div>` : ""}
        ${others.length ? `<div class="kother">다른 기출어 ${others.map(o => `<span class="jp" lang="ja">${esc(o.w)}</span> ${esc(o.r)}`).join(" · ")}</div>` : ""}
      </div>
    </div>`;
  }).join("");
  return `<div class="kinfo"><h3>한자 정보</h3>${rows}</div>`;
}

function renderQ() {
  const w = Q.items[Q.i], read = Q.mode === "read";
  Q.answered = false;
  Q.opts = read ? readingOptions(w, WORDS, ALSO_VALID) : listeningOptions(w, WORDS);
  Q.correct = read ? Q.opts.indexOf(w.r) : Q.opts.indexOf(w);

  $("#bar").style.width = (Q.i / Q.items.length * 100) + "%";
  $("#count").textContent = `${Q.i + 1} / ${Q.items.length}`;

  if (read) {
    $("#mondai").innerHTML = `<b>問題1</b><span class="jp">＿＿の言葉の読み方として最もよいものを、1・2・3・4から一つえらびなさい。</span>`;
    $("#stem").innerHTML = `<div class="stem"><div class="word" lang="ja">${esc(w.w)}</div>${tagsHTML(w)}</div>`;
  } else {
    $("#mondai").innerHTML = `<b>듣기</b>발음을 듣고 맞는 한자를 고르세요.`;
    $("#stem").innerHTML = `<div class="stem listen">
      <button class="play" id="play" aria-label="다시 듣기">${SPEAKER}</button>
      <button class="slow" id="play-slow">천천히 듣기</button>
      <p class="listen-hint">소리가 안 나오면 무음 모드를 확인하세요</p></div>`;
    $("#play").addEventListener("click", () => speak(speechText(w)));
    $("#play-slow").addEventListener("click", () => speak(speechText(w), true));
  }

  const labels = Q.opts.map(o => read ? o : o.w);
  const longest = Math.max(...labels.map(s => s.replace(/^～/, "").length));
  $("#opts").className = "opts" + (longest > 6 ? " one" : "");
  $("#opts").innerHTML = labels.map((s, k) =>
    `<li><button class="opt" data-k="${k}" lang="ja"><span class="num">${k + 1}</span><span>${esc(s)}</span></button></li>`).join("");
  $("#feedback").hidden = true;
  $("#next").hidden = true;

  if (!read) speak(speechText(w));
}

$("#opts").addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (b) answer(+b.dataset.k);
});

function answer(k) {
  if (!Q || Q.answered) return;
  Q.answered = true;
  const w = Q.items[Q.i], ok = k === Q.correct;
  record(w.id, ok);
  Q.log.push({ w, ok });

  document.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === Q.correct) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const fb = $("#feedback");
  fb.innerHTML = `
    <div class="verdict">${ok ? '<span class="sym">○</span>정답' : `<span class="sym">／</span>오답 · 정답은 ${Q.correct + 1}번`}</div>
    <div class="answer">
      <span class="w" lang="ja">${esc(w.w)}</span>
      <span class="r" lang="ja">${esc(w.r)}</span>
      <button class="say" id="say" aria-label="발음 듣기">${SPEAKER}</button>
    </div>
    <p class="mean">${esc(w.m)}</p>
    ${Q.mode === "listen" ? tagsHTML(w).replace('class="tags"', 'class="tags" style="justify-content:flex-start"') : ""}
    ${kanjiHTML(w)}`;
  fb.hidden = false;
  $("#say").addEventListener("click", () => speak(speechText(w)));

  const nx = $("#next");
  nx.textContent = Q.i + 1 < Q.items.length ? "다음 문제" : "결과 보기";
  nx.hidden = false;
  if (Q.mode === "read" && store.set.auto) speak(speechText(w));
}

function next() {
  if (!Q || !Q.answered) return;
  if (Q.i + 1 < Q.items.length) { Q.i++; renderQ(); window.scrollTo(0, 0); }
  else showResult();
}
$("#next").addEventListener("click", next);
$("#quit").addEventListener("click", () => {
  try { speechSynthesis.cancel(); } catch (e) {}
  if (Q && Q.log.length) showResult(); else { renderHome(); show("home"); }
});

// ---- 결과 ----
function showResult() {
  const total = Q.log.length, right = Q.log.filter(x => x.ok).length;
  const pct = total ? Math.round(right / total * 100) : 0;
  Q.wrongItems = Q.log.filter(x => !x.ok).map(x => x.w);
  $("#r-score").textContent = right;
  $("#r-total").textContent = `/ ${total}`;
  $("#r-pct").textContent = pct + "%";
  $("#r-msg").textContent = pct === 100 ? "전부 맞혔어요. 이 범위는 탄탄해요."
    : pct >= 80 ? "좋아요. 틀린 단어만 한 번 더 보면 확실해져요."
    : pct >= 60 ? "합격권이에요. 틀린 단어는 오답노트에 모아뒀어요."
    : "틀린 단어 위주로 한 번 더 돌려봐요. 오답노트에 저장했어요.";
  const box = $("#r-wrong-box");
  if (Q.wrongItems.length) {
    box.hidden = false;
    $("#r-wrong-title").textContent = `틀린 단어 ${Q.wrongItems.length}개`;
    $("#r-wrong").innerHTML = Q.wrongItems.map((w, i) => `<li>
      <div class="top"><span class="w" lang="ja">${esc(w.w)}</span><span class="r" lang="ja">${esc(w.r)}</span></div>
      <span class="m">${esc(w.m)} · ${esc(yearsText(w))}</span>
      <button class="say" data-i="${i}" aria-label="${esc(w.w)} 발음 듣기">${SPEAKER}</button></li>`).join("");
  } else box.hidden = true;
  $("#retry-wrong").hidden = !Q.wrongItems.length;
  $("#bar").style.width = "100%";
  show("result");
}
$("#r-wrong").addEventListener("click", e => {
  const b = e.target.closest(".say");
  if (b) speak(speechText(Q.wrongItems[+b.dataset.i]));
});
$("#retry-wrong").addEventListener("click", () => startQuiz(shuffle(Q.wrongItems.slice()), Q.mode, Q.rangeKey));
$("#retry-same").addEventListener("click", () => {
  const list = pool(Q.rangeKey);
  startQuiz(choose(list.length ? list : WORDS, store.set.count), Q.mode, Q.rangeKey);
});
$("#go-home").addEventListener("click", () => { renderHome(); show("home"); });

// ---- 키보드 (PC) ----
document.addEventListener("keydown", e => {
  if ($("#quiz").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-4]$/.test(e.key)) answer(+e.key - 1);
  else if ((e.key === "Enter" || e.key === "ArrowRight") && Q && Q.answered) { e.preventDefault(); next(); }
  else if (e.key.toLowerCase() === "r" && Q) speak(speechText(Q.items[Q.i]));
});

renderHome();
</script>
</body>
</html>
